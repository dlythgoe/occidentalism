<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Occidentalism</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Filter controls -->
    <div id="controls">
        <!-- Added collapsible tags section -->
        <div class="collapsible-section">
            <button id="toggle-filters" class="section-toggle">Tags [+]</button>
            <div id="filter-container" class="section-content" style="display: none;">
                <div id="tag-filters"></div>
                <button id="reset-filters">Clear filters</button>
                <button id="reset-view">Reset view</button>
            </div>
        </div>

        <!-- Added collapsible papers section -->
        <div class="collapsible-section">
            <button id="toggle-papers" class="section-toggle">Papers [+]</button>
            <div id="papers-container" class="section-content" style="display: none;">
                <div id="papers-list"></div>
            </div>
        </div>

        <!-- About button - opens the seminar summary in the paper overlay -->
        <div class="collapsible-section">
            <button id="toggle-about" class="section-toggle">About</button>
        </div>
    </div>

    <!-- Main viewport for the image board -->
    <div id="viewport">
        <div id="board"></div>
    </div>

    <!-- Reload button -->
    <button id="reload-btn" title="Reload" aria-label="Reload page">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
        </svg>
    </button>

    <!-- Modal for enlarged view -->
    <div id="modal" class="hidden">
        <div id="modal-content">
            <span id="modal-close">&times;</span>
            <img id="modal-image" src="/placeholder.svg" alt="">
            <div id="modal-info">
                <h2 id="modal-title"></h2>
                <p id="modal-description"></p>
                <div id="modal-tags"></div>
                <p id="modal-credit"></p>
            </div>
        </div>
    </div>

    <!-- Reverted paper modal - title scrolls with content, only close button is sticky -->
    <div id="paper-modal" class="hidden">
        <span id="paper-modal-close">&times;</span>
        <div id="paper-modal-content">
            <h2 id="paper-title"></h2>
            <div id="paper-body"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
